[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reliable-ai-agents"
version = "0.1.0"
description = "A local, model-agnostic evaluation toolkit for AI agent runs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aayush1003" }]
dependencies = []

[project.scripts]
agent-eval = "agent_eval.cli:main"

[tool.setuptools]
packages = ["agent_eval"]
